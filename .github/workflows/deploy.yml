name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Cap this step so a stalled verification cannot use the full runner limit: `npm run verify` sat for 44
    # minutes on a step that takes 4:11 locally, with no timeout in the script or on the step, so it was on.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the post-build prerender step (scripts/prerender.mjs) renders each
      # page in headless Chromium and inlines the static #root markup
      - run: npx playwright install --with-deps chromium
      # fact/framing gate (also runs as the build's prestep)
      - run: node scripts/check-facts.mjs
      # The generated figure must match its committed benchmark, not just be regenerable from it.
      - run: node scripts/generate-figures.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # The site claims this runs. /projects/ says of itself that it "won't build if a fact check or
      # Playwright assertion fails" — and until now CI ran the fact check and no Playwright assertion at all, making the one.
      - run: npm run verify
      # verify.mjs rewrites docs/*.png as a side effect; those are documentation
      # screenshots, not build output, so a CI-only diff must not fail the deploy.
      - run: git checkout -- docs || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
