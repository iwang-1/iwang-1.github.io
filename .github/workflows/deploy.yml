name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the post-build prerender step (scripts/prerender.mjs) renders each
      # page in headless Chromium and inlines the static #root markup
      - run: npx playwright install --with-deps chromium
      # fact/framing gate (also runs as the build's prestep)
      - run: node scripts/check-facts.mjs
      # The generated figure must MATCH its committed benchmark, not just be
      # regenerable from it. `npm run build` regenerates in write mode, which
      # would silently overwrite a hand-edited src/generated/sweep-figure.ts and
      # deploy the corrected file with no complaint — so a bad committed artifact
      # was undetectable. --check exists precisely to make the file's own "DO NOT
      # EDIT BY HAND" header a rule rather than a request; it was never wired up.
      - run: node scripts/generate-figures.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # THE SITE CLAIMS THIS RUNS. /projects/ says of itself that it "won't build
      # if a fact check or Playwright assertion fails" — and until now CI ran the
      # fact check and no Playwright assertion at all, making the one claim on the
      # page a reader could falsify from the repo in 30 seconds false. Rather than
      # softening the sentence, the pipeline now earns it: every assertion in
      # verify.mjs runs here, against the built dist/, before anything deploys.
      - run: npm run verify
      # verify.mjs rewrites docs/*.png as a side effect; those are documentation
      # screenshots, not build output, so a CI-only diff must not fail the deploy.
      - run: git checkout -- docs || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
